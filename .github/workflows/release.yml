name: Release

# Push a version tag (`git push origin v0.1.2`) to STAGE a release. The tag must
# match `version` in package.json. Nothing reaches the registry here: `npm stage
# publish` only files the version in npm's staging area, and a maintainer
# approves it with 2FA on npmjs.com before it becomes public.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # draft GitHub Release
  id-token: write # OIDC identity for npm trusted publishing

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1; Node 22 still ships npm 10.
      - run: npm i -g npm@11

      # Same peer-type anchor as ci.yml: `scripts/dsh-paths.mjs` is strict, and
      # `prepublishOnly` (build + full test suite) runs it before packing.
      - name: Provide peer types for scripts/dsh-paths.mjs
        run: |
          mkdir -p "$RUNNER_TEMP/dsh-peers"
          cd "$RUNNER_TEMP/dsh-peers"
          npm init -y >/dev/null
          npm i --no-audit --no-fund --no-save @deepseek-ai/dsh-client-ui-settings@0.2.0-rc.2
          echo "DSH_APP_DIR=$RUNNER_TEMP/dsh-peers" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      - name: The tag must match package.json
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(node -p "require('./package.json').version")"
          echo "tag=$GITHUB_REF_NAME package.json=$have"
          if [ "$want" != "$have" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $have"
            exit 1
          fi

      # No NPM_TOKEN: npm exchanges this workflow's OIDC identity for a
      # short-lived credential. Staging needs no 2FA and publishes nothing, so a
      # bad tag cannot reach the registry on its own. package.json's
      # prepublishOnly runs the build and the tests before the tarball is packed.
      - name: Stage on npm (nothing goes live)
        id: stage
        run: |
          set -o pipefail
          npm stage publish | tee "$RUNNER_TEMP/stage.log"
          id="$(grep -oE 'staged with id [0-9a-f-]{36}' "$RUNNER_TEMP/stage.log" | awk '{print $NF}' | head -1)"
          if [ -z "$id" ]; then
            echo "::warning::could not parse the stage id from the output - read it from this step's log"
          fi
          echo "stage_id=$id" >> "$GITHUB_OUTPUT"

      - name: How to finish this release
        run: |
          {
            echo "## Staged \`$GITHUB_REF_NAME\` — your approval is required"
            echo
            echo "Stage id: \`${{ steps.stage.outputs.stage_id || 'see the Stage on npm step log' }}\`"
            echo
            echo "Nothing is public yet. To finish:"
            echo
            echo "1. Approve it (2FA) — <https://www.npmjs.com/settings/0x7a76/staged>"
            echo "   or \`npm stage approve ${{ steps.stage.outputs.stage_id }}\`."
            echo "2. Publish the draft GitHub Release for \`$GITHUB_REF_NAME\`."
            echo "3. Optional: refresh an installed profile —"
            echo "   \`dsh plugin --profile desktop add dsh-extra-paths@${GITHUB_REF_NAME#v}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # Draft on purpose: publish it by hand right after approving on npm.
      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes
